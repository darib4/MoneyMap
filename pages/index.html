<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Map - Home Page</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">    
            <a href="index.html" class="logo">
                <img src="../images/logo-text.png" alt="MoneyMap logo">
            </a>

            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#help">Help</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
    <section class="hero">

        <div class="hero-content">
            <p class="hero-label">TRACK · PLAN · GROW</p>

            <h1>
                Take control<br>
                <span>of your money.</span>
            </h1>

            <p class="hero-description">
                Track expenses, manage budgets
                and reach your financial goals —
                all in one place.
            </p>

            <div class="hero-actions">
                <a href="register.html" class="btn-register">
                    Create account
                </a>

                <a href="login.html" class="btn-login">
                    Log in
                </a>
            </div>
        </div>

        <figure class="hero-image">
            <img
                src="../images/index_mockups.png"
                alt="MoneyMap dashboard preview"
            >
        </figure>

    </section>

    <section class="features">
        <article class="feature">
            <img src="../images/features/chart.svg" alt="Chart icon">
            <h3>Track</h3>
            <p>your expenses</p>
        </article>

        <article class="feature">
            <img src="../images/features/wallet.svg" alt="Wallet icon">
            <h3>Plan</h3>
            <p>your budgets</p>
        </article>

        <article class="feature">
            <img src="../images/features/goal.svg" alt="Goal icon">
            <h3>Reach</h3>
            <p>your goals</p>
        </article>
    </section>
</main>
    
    <script src="../js/script.js"></script>
</body>
</html>
