<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="../styles/login-register.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header class="auth-reader">
        <a href="index.html" class="logo">
            <img src="../assets/logo-text.png" alt="MoneyMap logo">
        </a>
    </header>

    <main class="auth-page">
        <section class="auth-intro">
            <img src="../assets/logo.png" alt="MoneyMap logo">
            <h1>Never worry about money again.</h1>
        </section>

        <section class="auth-card">
            <h2>Log In</h2>
            <form class="register-form">
                <div class="form-group">
                    <label for="email"></label>

                    <div class="input-wrapper">
                        <img
                            src="../assets/login-register/mail.svg"
                            alt=""
                            class="input-icon"
                        >

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"></label>

                    <div class="input-wrapper">
                        <img
                            src="../assets/login-register/lock.svg"
                            alt=""
                            class="input-icon"
                        >

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                            aria-label="Show password"
                        >
                            <img
                                src="../assets/login-register/eye.svg"
                                alt=""
                                class="toggle-icon"
                            >
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-register-submit">
                    Log In
                </button>
            </form>
        </section>
    </main>
    <script type="module" src="../scripts/login.js"></script>
</body>
</html>
