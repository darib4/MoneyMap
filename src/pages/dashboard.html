<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
    <aside class="sidebar">
        <a href="dashboard.html" class="sidebar-logo">
            <img src="../assets/logo-text.png" alt="MoneyMap logo">
        </a>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="active">
                <img src="../assets/features/house.svg" alt="">
                <span>Dashboard</span>
            </a>
            <a href="transactions.html">
                <img src="../assets/features/list.svg" alt="">
                <span>Transactions</span>
            </a>
            <a href="budgets.html">
                <img src="../assets/features/wallet-cards.svg" alt="">
                <span>Budgets</span>
            </a>
            <a href="analytics.html">
                <img src="../assets/features/analytics.svg" alt="">
                <span>Analytics</span>
            </a>
            <a href="goals.html">
                <img src="../assets/features/goal.svg" alt="">
                <span>Goals</span>
            </a>
            <a href="settings.html">
                <img src="../assets/features/settings.svg" alt="">
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <main class="dashboard">
        <header class="dashboard-header">
            <div class="dashboard-greeting">
                <h1>
                    <span id="greeting"></span>
                    <span id="user-first-name"></span>
                </h1>
                <p>Here's what's happening with your money today.</p>
            </div>

            <form class="search-bar" role="search">
                <input type="search" placeholder="Search transactions, categories...">
            </form>

            <div class="date-picker">
                <label for="dashboard-date" class="visually-hidden"></label>
                 <input
                    type="date"
                    id="dashboard-date"
                    name="dashboard-date"
                >
            </div>

            <a href="transactions.html" class="add-transaction-btn">
                + Add transaction
            </a>

            <div class="profile-area">
                <button type="button" class="profile-button" id="profile-button">

                    <span class="profile-avatar" id="profile-avatar"></span>

                    <span class="profile-name" id="profile-name"></span>

                    <img
                        src="../assets/dashboard/user.svg"
                        alt=""
                        class="profile-arrow"
                    >
                </button>

                <div class="profile-menu" id="profile-menu">
                    <button type="button" id="logout-button">Log out</button>
                </div>
            </div>
        </header>

        <section class="summary-cards">
            <article class="summary-card">
                <p class="summary-card-title">Current balance</p>
                <h2 id="current-balance"></h2>
            </article>

            <article class="summary-card">
                <p class="summary-card-title">Income</p>
                <h2 id="total-income"></h2>
            </article>

            <article class="summary-card">
                <p class="summary-card-title">Expenses</p>
                <h2 id="total-expenses"></h2>
            </article>

            <article class="summary-card">
                <p class="summary-card-title">Remaining budget</p>
                <h2 id="remaining-budget"></h2>
            </article>
        </section>

        <section class="charts-section">
            <article class="dashboard-card">
                <h2>Monthly Spending Trend</h2>
                <div class="chart-placeholder"></div>
            </article>

            <article class="dashboard-card">
                <h2>Expenses by Category</h2>
                <div class="chart-placeholder"></div>
            </article>

            <article class="dashboard-card">
                <h2>Income vs Expenses</h2>
                <div class="chart-placeholder"></div>
            </article>
        </section>

        <section class="dashboard-details">
            <article class="budget-card">
                <h2 class="card-title">Budget Progress</h2>
                <div class="budget-progress"></div>
            </article>

            <article class="goal-card">
                <h2 class="card-title">Savings Goal</h2>
                <div class="goal-progress"></div>
            </article>

            <article class="transactions-card">
                <h2 class="card-title">Recent Transactions</h2>
                <div class="transactions-list"></div>
            </article>
        </section>
    </main>
    
    <script type="module" src="../scripts/dashboard.js"></script>
</body>
</html>
